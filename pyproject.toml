[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cmu-services-api"
version = "0.1.0"
description = "A minimal university-services question-answering API for TM1."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Noah Hicks" },
  { name = "Taha Zakir" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
